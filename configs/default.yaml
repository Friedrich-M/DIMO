# Default configuration for DIMO. Every key can be overridden on the command line as `key=value`.

# ----------------------------------------------------------------------------- Data
input_folder:              # folder with <motion>/view_XX/FF.png (and optionally info.json)
input_videos:              # motion names to use (list or comma-separated); defaults to info.json
num_views: 9               # default only: the dataset's info.json wins (SV4D 1.0 / sv4d2_8views = 9, sv4d2 = 5)
num_frames: 21             # default only: the dataset's info.json wins
elevation: 0               # camera elevation of the input views (degrees)
ref_size: 576              # input frames are resized to ref_size x ref_size
num_workers: 16            # processes used to load frames / compute masks
# How a missing foreground mask is computed, once, then cached beside the frame as FF_mask.npy.
#   rembg     the u2net matting network: general, but ~0.2 s per frame
#   white_bg  distance to white, for frames rendered on a white background (all of this
#             pipeline's output): ~30x faster, and it keeps white parts of the object
mask_method: rembg

# ----------------------------------------------------------------------------- Cameras / visualisation
radius: 2                  # orbit camera radius
fovy: 33.9                 # vertical field of view (degrees), matches SV4D
H: 800                     # visualisation resolution
W: 800

# ----------------------------------------------------------------------------- Output / checkpoints
save_path:                 # training: output folder; testing: checkpoint folder
load_stage: ""             # training: "" to train from scratch, "s1" to resume from a stage-1 checkpoint
load_path:                 # training: folder to resume from (defaults to save_path)
ckpt_step:                 # load the checkpoint saved at this step instead of the final one
save_inter: 500            # save a checkpoint every N steps
debug_image_interval: 100  # dump a gt | render comparison every N steps
tb_image_interval: 10      # log images / latent histograms to tensorboard every N steps
seed: 0

# ----------------------------------------------------------------------------- Model
vae_latent: False          # Gaussian (VAE-style) latent codes with a KL loss
latent_code_dim: 32
sh_degree: 0
add_normal: True           # render normals (needs diff-gauss) and apply the normal smoothness loss
knn: 4                     # key points blended per Gaussian in stage 2

# ----------------------------------------------------------------------------- Training schedule
iters_s1: 1500             # stage 1: motion pre-training on key points
iters_s2: 5000             # stage 2: joint motion / geometry refinement
batch_size: 4              # frames x views per motion; 2 * batch_size motions per step
num_cpts: 512              # number of key points
FPS_iter: 1000             # stage 1: farthest point sampling back to num_cpts every N steps
init_radius: 0.5           # radius of the initial random point cloud
init_type: ag              # stage 2 Gaussian initialisation: "ag" (around key points) or "normal" (random ball)
num_pts: 100000            # stage 2 Gaussians for init_type=normal
num_pts_per_cpt: 200       # stage 2 Gaussians spawned per key point for init_type=ag
init_ratio: 1              # spawn radius = init_ratio * mean key-point radius
render_resolution_steps: [300, 450]      # coarse-to-fine: render at render_resolutions[i] while step < steps[i]
render_resolutions: [128, 256, 512]
prune_opacity_s1_end: 0.01               # key points below this opacity are dropped at the end of stage 1

# ----------------------------------------------------------------------------- Losses
lambda_mse: 5000.0
lambda_lpips: 1000.0
lambda_ssim: 500.0
lambda_mask: 500.0
add_depth: True            # edge-aware depth smoothness
depth_reg_start_iter: 200
lambda_smooth: 100.0
normal_reg_start_iter: 200 # bilateral normal smoothness (needs add_normal)
lambda_bilateral: 0.05
add_ga: True               # stage 2: anchor key-point trajectories to the stage-1 ones
ga_chamfer: True           # ... with a one-directional Chamfer distance (else L1)
lambda_ga1: 10.0
lambda_ga2: 10000.0
use_arap: True             # as-rigid-as-possible regularisation of the key points
arap_start_iter_s1: 1000
arap_end_iter_s2: 2000
lambda_arap: 10.0
lambda_kl: 0.05            # only with vae_latent

# ----------------------------------------------------------------------------- Densification (stage 1) and pruning
percent_dense: 0.01
density_start_iter: 100
density_end_iter: 1000
densification_interval: 100
densify_grad_threshold: 0.01
densify_opacity_threshold_s1: 0.01
opacity_reset_interval: 200000
density_end_iter_s2: 5000
densification_interval_s2: 1000
densify_opacity_threshold_s2: 0.01

# ----------------------------------------------------------------------------- Learning rates
position_lr_init: 0.01             # stage-1 Gaussian positions, decayed to position_lr_final over position_lr_max_steps_s1
position_lr_final: 0.0002
position_lr_delay_mult: 0.02
position_lr_max_steps_s1: 500
position_lr_init_s2: 0.0002        # stage-2 Gaussian positions: constant for position_lr_warmup_s2 steps, then decayed over iters_s2
position_lr_final_s2: 0.000002
position_lr_warmup_s2: 1000
feature_lr: 0.01
opacity_lr: 0.05
scaling_lr: 0.005
rotation_lr: 0.005
r_lr: 0.01                         # shared key-point radius (stage 1)
c_radius_lr: 0.005                 # per-key-point radius (stage 2)
c_position_lr_init: 0.000002       # key-point positions (stage 2)
c_position_lr_final: 0.000002
c_position_lr_delay_mult: 0.02
latent_code_lr_init: 0.005         # latent codes (decayed from stage 2 on)
latent_code_lr_final: 0.0002
deform_lr_init: 0.0002             # motion decoder (decayed from stage 2 on)
deform_lr_final: 0.000002
finetune_lr_max_steps: 1000        # decay horizon of the test-time fitting modes

# ----------------------------------------------------------------------------- Inference
mode: render               # render | interpolation | language | fit_motion | fit_unaligned_motion | benchmark
test_stage: s2             # checkpoint stage to load
test_azi: 0                # azimuth of the fixed reference view
video_save_dir: vis        # output folder
render_videos:             # render: motions to render (list or comma-separated); all by default
render_views: False        # render: also render every training view (frames + videos)
save_frames: False         # also dump the reference-view frames as png
save_grid: True            # render: tile all rendered motions into grid videos
grid_tile_size: 256          # tiles are downscaled to this before the grid is built, to bound memory
traj_trace_length: 5       # frames of trajectory trail drawn behind each key point
traj_cmap: hsv
save_traj_html: False      # interactive 3D trajectory page (needs scenepic)
interp_videos: [04-032041, 11-raise]   # interpolation: the two motions to blend
interp_alpha: [0.0, 0.5, 1.0]          # one value or a list; a list also writes a side-by-side sweep
test_text_prompt:          # language: the prompt
text_encoder_ckpt: ckpts/mlp_encoder.pth   # language: BERT -> latent projector weights
bert_cache_dir:            # language: HuggingFace cache folder for bert-base-cased
test_motion_data:          # fit_motion / fit_unaligned_motion: folder with view_XX/FF.png of the new motion
fit_steps: 1000
fit_unaligned_steps_s1: 400
finetune_resolution_steps: [100, 200]
benchmark_rounds: 500
